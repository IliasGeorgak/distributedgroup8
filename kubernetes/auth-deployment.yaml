apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
  labels:
    app: auth
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth
  template:
    metadata:
      labels:
        app: auth
    spec:
      containers:
      - name: auth
        image: ${AUTH_IMAGE}
        imagePullPolicy: ${AUTH_IMAGE_PULL_POLICY}
        ports:
        - containerPort: ${AUTH_PORT}
        envFrom:
        - secretRef:
            name: postgres-secret
        - secretRef:
            name: auth-secret
        - configMapRef:
            name: postgres-config
        - configMapRef:
            name: auth-config
        resources:
          requests:
            memory: "128Mi"
            cpu: "250m"
          limits:
            memory: "256Mi"
            cpu: "500m"

---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
spec:
  selector:
    app: auth
  ports:
    - protocol: TCP
      port: ${AUTH_PORT}
      targetPort: ${AUTH_PORT}
  type: ClusterIP
