apiVersion: apps/v1
kind: Deployment
metadata:
  name: ui
  labels:
    app: ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ui
  template:
    metadata:
      labels:
        app: ui
    spec:
      containers:
      - name: ui
        image: ${UI_IMAGE}
        imagePullPolicy: ${UI_IMAGE_PULL_POLICY}
        ports:
        - containerPort: ${UI_PORT}
        envFrom:
        - secretRef:
            name: postgres-secret
        - configMapRef:
            name: auth-config
        env:
        - name: UI_MANAGER_REQUEST_TIMEOUT_SECONDS
          value: "${UI_MANAGER_REQUEST_TIMEOUT_SECONDS}"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"

---
apiVersion: v1
kind: Service
metadata:
  name: ui-service
spec:
  selector:
    app: ui
  ports:
    - protocol: TCP
      port: ${UI_PORT}
      targetPort: ${UI_PORT}
  type: LoadBalancer
