apiVersion: v1
kind: ServiceAccount
metadata:
  name: manager-service-account

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: manager-job-runner
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: manager-job-runner-binding
subjects:
  - kind: ServiceAccount
    name: manager-service-account
roleRef:
  kind: Role
  name: manager-job-runner
  apiGroup: rbac.authorization.k8s.io

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: manager
  labels:
    app: manager
spec:
  replicas: 1
  selector:
    matchLabels:
      app: manager
  template:
    metadata:
      labels:
        app: manager
    spec:
      serviceAccountName: manager-service-account
      automountServiceAccountToken: true
      containers:
      - name: manager
        image: mngr
        imagePullPolicy: Never
        ports:
        - containerPort: 8000
        envFrom:
        - secretRef:
            name: postgres-secret
        - secretRef:
            name: minio-secret
        - configMapRef:
            name: postgres-config
        - configMapRef:
            name: minio-config
        env:
        - name: WORKER_IMAGE
          value: "worker:latest"
        - name: WORKER_IMAGE_PULL_POLICY
          value: "Never"
        - name: WORKER_JOB_TIMEOUT_SECONDS
          value: "900"
        - name: MANAGER_MAX_TASK_ATTEMPTS
          value: "3"
        - name: MANAGER_MAX_JOB_ATTEMPTS
          value: "3"
        - name: MANAGER_FAILED_JOB_RETRY_DELAY_SECONDS
          value: "5"
        - name: MANAGER_STALE_JOB_SECONDS
          value: "300"
        - name: KUBERNETES_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        resources:
          requests:
            memory: "128Mi"
            cpu: "250m"
          limits:
            memory: "256Mi"
            cpu: "500m"

---
apiVersion: v1
kind: Service
metadata:
  name: manager-service
spec:
  selector:
    app: manager
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
  type: ClusterIP
