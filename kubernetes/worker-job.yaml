apiVersion: batch/v1
kind: Job
metadata:
  name: worker-job
spec:
  ttlSecondsAfterFinished: 30

  template:
    spec:
      restartPolicy: Never

      containers:
      - name: worker

        image: worker:latest
        imagePullPolicy: Never

        envFrom:
        - secretRef:
            name: postgres-secret
        - secretRef:
            name: minio-secret
        - configMapRef:
            name: postgres-config
        - configMapRef:
            name: minio-config

        command: ["python", "worker.py"]

        args:
          - "--task-json"
          - '{"task_id":"job-3-map-1","task_type":"map","input_bucket":"betet","input_objects":["demo-input.txt"],"output_bucket":"betet","output_object":"results/job-3-map-1.json","parameters":{"case_sensitive":false,"r_partitions":1,"partition_function":"md5"}}'