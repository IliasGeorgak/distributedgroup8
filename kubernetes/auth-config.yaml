
apiVersion: v1
kind: ConfigMap
metadata:
  name: auth-config
data:
  AUTH_HOST: auth-service
  AUTH_PORT: "${AUTH_PORT}"
  MANAGER_SERVICE_URL: "${MANAGER_SERVICE_URL}"
  MANAGER_REPLICAS: "${MANAGER_REPLICAS}"

---
apiVersion: v1
kind: Secret
metadata:
  name: auth-secret
type: Opaque
stringData:
  SECRET_KEY: "${AUTH_SECRET_KEY}"
