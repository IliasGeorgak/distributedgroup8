apiVersion: batch/v1
kind: Job
metadata:
  name: {{ worker_id }}
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: {{ ttl_seconds_after_finished }}
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: worker
          image: {{ image }}
          imagePullPolicy: {{ image_pull_policy }}
          command: ["python3", "worker.py"]
          args:
          {% for arg in args %}
          - {{ arg | tojson }}
          {% endfor %}
          envFrom:
            - secretRef:
                name: postgres-secret
            - secretRef:
                name: minio-secret
            - configMapRef:
                name: postgres-config
            - configMapRef:
                name: minio-config
